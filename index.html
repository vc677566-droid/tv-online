<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Latino Player</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--ac:#38bdf8;--mut:#94a3b8}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--ac:#0369a1;--mut:#64748b}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
h1{font-size:18px;margin:0;flex:1}
select,input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #475569;background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#0f172a;border:0;font-weight:600}
main{display:grid;gap:12px;padding:0 12px 12px;max-width:1100px;margin:auto}
@media(min-width:800px){main{grid-template-columns:2fr 1fr}}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}
#now{margin:6px 0;font-weight:600}
#msg{color:var(--mut);margin:6px 0}
#fb{display:none;width:100%;padding:12px;margin-top:6px}
aside{background:var(--card);border-radius:10px;padding:8px}
#q{width:100%;margin-bottom:8px}
#l{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
#l li{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:0 40px}
#l li:hover,#l li.on{background:rgba(56,189,248,.2)}
#l img{width:32px;height:32px;object-fit:contain;flex:none}
#l small{color:var(--mut);display:block}
.st{background:none;color:#facc15;font-size:20px;padding:2px 6px;border:0;flex:none}
#inst{display:none}
footer{text-align:center;padding:4px 12px 24px;color:var(--mut)}
footer p{margin:6px 0 0;font-size:13px}
.cf{display:inline-flex;gap:8px;align-items:center;background:#facc15;color:#0f172a;font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none}
footer{text-align:center;padding:4px 12px 24px;color:var(--mut);font-size:13px}
footer p{margin:0 0 8px}
footer img{max-width:100%;height:auto}
</style></head><body>
<header>
 <h1>📺 TV Latino</h1>
 <select id="src"></select>
 <button id="inst">⬇️ Instalar</button>
</header>
<main>
 <section>
  <video id="v" controls autoplay playsinline></video>
  <div id="now">Elegí un canal</div>
  <div id="msg">Cargando lista…</div>
  <button id="fb">🔎 Buscar lista gratuita funcionando (100% gratis y legal)</button>
 </section>
 <aside>
  <input id="q" type="search" placeholder="Buscar canal…">
  <ul id="l"></ul>
 </aside>
</main>
<footer>
 <p>Ayudá a seguir diseñando esta app</p>
 <a href='https://cafecito.app/pablotv' rel='noopener' target='_blank'><img loading="lazy" srcset='https://cdn.cafecito.app/imgs/buttons/button_5.png 1x, https://cdn.cafecito.app/imgs/buttons/button_5_2x.png 2x, https://cdn.cafecito.app/imgs/buttons/button_5_3.75x.png 3.75x' src='https://cdn.cafecito.app/imgs/buttons/button_5.png' alt='Invitame un café en cafecito.app' /></a>
</footer>
<footer>
 <a class="cf" href="https://cafecito.app/pablotv" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 010 8h-1"/><path d="M3 8h14v9a4 4 0 01-4 4H7a4 4 0 01-4-4z"/><path d="M6 1v3M10 1v3M14 1v3"/></svg>Invitame un cafecito</a>
 <p>Ayudá a seguir diseñando esta app</p>
</footer>
<script>
const $=s=>document.querySelector(s),v=$('#v'),B='https://iptv-org.github.io/iptv/';
const SRC=[
 ['🇦🇷 Argentina',B+'countries/ar.m3u'],
 ['🌎 Latinoamérica',B+'regions/latam.m3u'],
 ['🗣️ Todo en español',B+'languages/spa.m3u']
];
// Listas de respaldo: catálogos públicos de canales de aire/gratuitos
const BACKUP=[
 ...['uy','cl','mx','co','pe','py','bo','ec','ve','cr','pa','do','gt','sv','hn','ni','cu','pr','es'].map(c=>[c.toUpperCase(),B+'countries/'+c+'.m3u']),
 ['Free-TV','https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'],
 ['Mundo','https://iptv-org.github.io/iptv/index.m3u']
];
let ch=[],hls=null,fails=0;
const msg=t=>$('#msg').textContent=t;
SRC.forEach((s,i)=>$('#src').add(new Option(s[0],i)));
$('#src').add(new Option('⭐ Mis favoritos','fav'));
let fav=[];try{fav=JSON.parse(localStorage.getItem('fav'))||[]}catch(e){}
const isFav=u=>fav.some(f=>f.u===u);
function toggleFav(c){
 fav=isFav(c.u)?fav.filter(f=>f.u!==c.u):[...fav,{n:c.n,u:c.u,logo:c.logo,g:c.g}];
 try{localStorage.setItem('fav',JSON.stringify(fav))}catch(e){}
}

function parse(t){
 const out=[],L=t.split(/\r?\n/);let m=null;
 for(const x of L){
  if(x.startsWith('#EXTINF')){
   m={n:(x.split(',').pop()||'').trim(),
      logo:(x.match(/tvg-logo="([^"]*)"/)||[])[1]||'',
      g:(x.match(/group-title="([^"]*)"/)||[])[1]||''};
  }else if(m&&/^https?:/i.test(x.trim())){
   m.u=x.trim();
   if(location.protocol==='https:'&&m.u.startsWith('http:'))m.u=null; // el navegador bloquea http en páginas https
   if(m.u&&m.n)out.push(m);
   m=null;
  }
 }
 return out;
}
async function load(url){
 const r=await Promise.race([fetch(url),new Promise((_,j)=>setTimeout(j,10000))]);
 if(!r.ok)throw 0;
 const c=parse(await r.text());
 if(!c.length)throw 0;
 return c;
}
function show(){
 const q=$('#q').value.toLowerCase(),l=$('#l');l.textContent='';
 ch.filter(c=>c.n.toLowerCase().includes(q)).slice(0,400).forEach(c=>{
  const li=document.createElement('li');
  li.innerHTML='<img loading="lazy" alt="" onerror="this.style.visibility=\'hidden\'"><div style="flex:1;min-width:0"><span></span><small></small></div><button class="st" title="Favorito"></button>';
  li.querySelector('img').src=c.logo;
  li.querySelector('span').textContent=c.n;
  li.querySelector('small').textContent=c.g;
  const st=li.querySelector('.st');st.textContent=isFav(c.u)?'★':'☆';
  st.onclick=e=>{e.stopPropagation();toggleFav(c);st.textContent=isFav(c.u)?'★':'☆';
   if($('#src').value==='fav'&&!isFav(c.u)){li.remove();ch=fav;msg(fav.length+' favoritos')}};
  li.onclick=()=>{document.querySelectorAll('#l .on').forEach(e=>e.classList.remove('on'));li.classList.add('on');play(c)};
  l.appendChild(li);
 });
}
async function loadHls(){
 if(window.Hls)return;
 await new Promise((ok,no)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
  s.onload=ok;s.onerror=no;document.head.appendChild(s)});
}
async function play(c){
 $('#now').textContent=c.n;msg('Conectando…');
 if(hls){hls.destroy();hls=null}
 v.removeAttribute('src');
 const bad=()=>{if(++fails>=3){msg('Varios canales no responden. La lista puede estar caída.');$('#fb').style.display='block'}else msg('Este canal no responde, probá otro.')};
 try{
  const isHls=/\.m3u8|\/hls|playlist/i.test(c.u);
  if(isHls&&!v.canPlayType('application/vnd.apple.mpegurl')){
   await loadHls();
   if(Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});
    hls.loadSource(c.u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});msg('');fails=0});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){hls.destroy();bad()}});
    return;
   }
  }
  v.src=c.u;v.onerror=bad;v.onplaying=()=>{msg('');fails=0};
  v.play().catch(()=>{});
 }catch(e){bad()}
}
async function start(i){
 $('#fb').style.display='none';fails=0;
 if(i==='fav'){ch=fav;msg(fav.length?fav.length+' favoritos':'Todavía no marcaste favoritos: tocá ☆ en un canal.');show();return}
 msg('Cargando lista…');
 const url=SRC[i][1];
 try{ch=await load(url);try{localStorage.setItem('l'+i,JSON.stringify(ch.slice(0,300)))}catch(e){}msg(ch.length+' canales')}
 catch(e){
  let c=null;try{c=JSON.parse(localStorage.getItem('l'+i))}catch(e){}
  if(c&&c.length){ch=c;msg('Sin conexión a la lista: mostrando la última guardada.')}
  else{ch=[];msg('No se pudo cargar la lista.');$('#fb').style.display='block'}
 }
 show();
}
$('#fb').onclick=async()=>{
 const b=$('#fb');b.disabled=true;
 for(const [n,u] of BACKUP){
  msg('Probando lista: '+n+'…');
  try{ch=await load(u);msg('✅ Lista funcionando: '+n+' ('+ch.length+' canales)');b.style.display='none';show();b.disabled=false;fails=0;return}catch(e){}
 }
 msg('No encontré otra lista ahora. Revisá tu conexión e intentá más tarde.');b.disabled=false;
};
$('#src').onchange=e=>start(e.target.value);
$('#q').oninput=show;
start(0);
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').style.display='inline-block'});
addEventListener('appinstalled',()=>$('#inst').style.display='none');
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
if(ios)$('#inst').style.display='inline-block';
$('#inst').onclick=async()=>{
 if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').style.display='none'}
 else if(ios)alert('En iPhone/iPad: tocá Compartir y elegí "Agregar a pantalla de inicio".');
};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
